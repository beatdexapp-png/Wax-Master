name: capture
on:
  push:
    branches: [capture]
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright && npx playwright install --with-deps chromium
      - run: node cap/cap-real.cjs out
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for d in out/*/; do n=$(basename $d); ffmpeg -loglevel error -y -framerate 30 -i $d/%04d.jpg -c:v libx264 -crf 14 -preset slow -pix_fmt yuv420p out/$n.mp4; done
          ls -la out
      - run: |
          mkdir pub && cp out/*.mp4 out/*.png pub/
          cd pub && git init -q -b capture-out && git add . && git -c user.name=waxdrop-bot -c user.email=bot@waxdrop.fr commit -qm clips && git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} capture-out
