<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="sec2.js"></script>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const RAR=[['Commun','#aab3bd'],['Rare','#5aa9ff'],['Ultra rare','#c27dff'],['Légendaire','#ffc23d'],['Mythique','#ff5f86'],['Divin','#f6dfa0']];
const cache=new Map();
function img(src){if(cache.has(src))return cache.get(src);const p=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});cache.set(src,p);return p}
const fr=(clip,n)=>img(clip+'/'+String(Math.max(0,Math.round(n))).padStart(4,'0')+'.jpg');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const eo=t=>1-Math.pow(1-cl(t),3), ei=t=>cl(t)**3, eob=t=>{t=cl(t);const s=1.70158;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const pr=(t,a,b)=>cl((t-a)/(b-a));
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function rnd(i){const s=Math.sin(i*12.9898)*43758.5453;return s-Math.floor(s)}
function bg(t,tint){x.fillStyle='#08070d';x.fillRect(0,0,W,H);
  const blobs=[[0.2,0.25,'#6d3fff'],[0.85,0.4,'#ff3d8b'],[0.4,0.85,'#ffb22e'],[0.75,0.1,'#2fb6ff']];
  blobs.forEach(([bx,by,col],i)=>{const px=W*(bx+0.08*Math.sin(t*0.6+i)),py=H*(by+0.05*Math.cos(t*0.5+i*2));const g=x.createRadialGradient(px,py,0,px,py,700);g.addColorStop(0,(tint&&i===2?tint:col)+'55');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,W,H)});
  x.globalAlpha=.05;for(let i=0;i<220;i++){x.fillStyle=rnd(i+Math.floor(t*30)*7)>.5?'#fff':'#000';x.fillRect(rnd(i*3+Math.floor(t*30))*W,rnd(i*7+Math.floor(t*30))*H,3,3)}x.globalAlpha=1}
function text(s,X,Y,size,opt={}){x.save();x.font=`${opt.w||900} ${size}px "${opt.f||'Inter Display'}"`;x.textAlign=opt.a||'center';x.textBaseline='alphabetic';
  x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=opt.sb??26;x.shadowOffsetY=6;
  if(opt.grad){const m=x.measureText(s);const g=x.createLinearGradient(X-m.width/2,Y-size,X+m.width/2,Y);opt.grad.forEach((c2,i)=>g.addColorStop(i/(opt.grad.length-1),c2));x.fillStyle=g}else x.fillStyle=opt.c||'#fff';
  x.globalAlpha=opt.al??1;x.fillText(s,X,Y);x.restore()}
function pop(s,X,Y,size,t0,t,opt={}){const p=eob(pr(t,t0,t0+.32));if(p<=0)return;x.save();x.translate(X,Y);const sc=.55+.45*p;x.scale(sc,sc);text(s,0,0,size,{...opt,al:cl(p*1.4)});x.restore()}
function pill(s,X,Y,size,col,fg,al=1){x.save();x.globalAlpha=al;x.font=`800 ${size}px "Inter Display"`;const w=x.measureText(s).width+size*1.4,h=size*1.75;rr(X-w/2,Y-h/2,w,h,h/2);x.fillStyle=col;x.fill();x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(s,X,Y+2);x.restore()}
function vinylBody(R,lab){const g=x.createRadialGradient(-R*.3,-R*.3,0,0,0,R);g.addColorStop(0,'#2a2a34');g.addColorStop(1,'#09090c');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();
  x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=2;for(let r=R*.4;r<R*.97;r+=R*.045){x.beginPath();x.arc(0,0,r,0,7);x.stroke()}
  x.fillStyle='rgba(255,255,255,.13)';x.beginPath();x.moveTo(0,0);x.arc(0,0,R,-.35,.05);x.fill();x.beginPath();x.moveTo(0,0);x.arc(0,0,R,Math.PI-.35,Math.PI+.05);x.fill();
  x.fillStyle=lab;x.beginPath();x.arc(0,0,R*.33,0,7);x.fill();x.fillStyle='#120d02';x.beginPath();x.arc(0,0,R*.05,0,7);x.fill()}
function vinyl(X,Y,R,rot,lab,glow,ga=1){x.save();x.translate(X,Y);
  if(glow){const g=x.createRadialGradient(0,0,R*.5,0,0,R*1.8);g.addColorStop(0,glow+'cc');g.addColorStop(1,'#0000');x.globalAlpha=ga;x.fillStyle=g;x.beginPath();x.arc(0,0,R*1.8,0,7);x.fill();x.globalAlpha=1}
  x.rotate(rot);vinylBody(R,lab);x.restore()}
/* le vinyle vole en éclats */
function shatter(X,Y,R,rot,p,lab){const n=12;for(let k=0;k<n;k++){const a0=k/n*Math.PI*2+rnd(k)*.2,a1=(k+1)/n*Math.PI*2+rnd(k+1)*.2,mid=(a0+a1)/2+rot;
  const d=eo(p)*(700+rnd(k+5)*700);x.save();x.globalAlpha=1-ei(p);x.translate(X+Math.cos(mid)*d,Y+Math.sin(mid)*d+p*p*500);x.rotate(rot+(rnd(k+9)-.5)*6*p);
  x.beginPath();x.moveTo(0,0);x.arc(0,0,R,a0,a1);x.closePath();x.clip();vinylBody(R,lab);x.restore()}}
function rays(X,Y,t,col,al,n=24){x.save();x.translate(X,Y);x.rotate(t*.4);x.globalAlpha=al;for(let i=0;i<n;i++){x.rotate(Math.PI*2/n);const g=x.createLinearGradient(0,0,0,-1500);g.addColorStop(0,col);g.addColorStop(1,col+'00');x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.lineTo(-40,-1500);x.lineTo(40,-1500);x.fill()}x.restore()}
function flash(a,col='#fff'){if(a<=0)return;x.save();x.globalAlpha=cl(a);x.fillStyle=col;x.fillRect(0,0,W,H);x.restore()}
function particles(t,t0,X,Y,cols,n=90,dur=1.5){const p=pr(t,t0,t0+dur);if(p<=0||p>=1)return;for(let i=0;i<n;i++){const a=rnd(i)*7,s=500+rnd(i+9)*1000,d=eo(p)*s;x.globalAlpha=1-p;x.fillStyle=cols[i%cols.length];x.beginPath();x.arc(X+Math.cos(a)*d,Y+Math.sin(a)*d+p*p*400,5+rnd(i+3)*10,0,7);x.fill()}x.globalAlpha=1}
function ring(t,t0,X,Y,col,dur=.6,max=1300){const p=pr(t,t0,t0+dur);if(p<=0||p>=1)return;x.save();x.globalAlpha=1-p;x.strokeStyle=col;x.lineWidth=40*(1-p)+4;x.beginPath();x.arc(X,Y,eo(p)*max,0,7);x.stroke();x.restore()}
function shake(t,t0,amp,dur=.35){const p=pr(t,t0,t0+dur);if(p<=0||p>=1)return[0,0];const k=(1-p)*amp;return[Math.sin(t*90)*k,Math.cos(t*77)*k]}
/* téléphone qui affiche une vraie capture de l'app */
function phone(im,X,Y,w,rot=0,al=1,sc=1){const h=w*844/390;x.save();x.globalAlpha=al;x.translate(X,Y);x.rotate(rot);x.scale(sc,sc);
  x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=90;x.shadowOffsetY=40;rr(-w/2-16,-h/2-16,w+32,h+32,84);x.fillStyle='#0d0d10';x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
  x.lineWidth=4;x.strokeStyle='#3a3a44';x.stroke();x.save();rr(-w/2,-h/2,w,h,68);x.clip();if(im)x.drawImage(im,-w/2,-h/2,w,h);x.restore();
  rr(-58,-h/2+14,116,32,16);x.fillStyle='#000';x.fill();x.restore()}
function panel(im,X,Y,w,sx,sy,sw,sh,sc=1){const h=w*sh/sw;x.save();x.translate(X,Y);x.scale(sc,sc);x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=80;x.shadowOffsetY=30;rr(-w/2,-h/2,w,h,56);x.fillStyle='#111';x.fill();x.shadowBlur=0;x.shadowOffsetY=0;x.save();rr(-w/2,-h/2,w,h,56);x.clip();if(im)x.drawImage(im,sx,sy,sw,sh,-w/2,-h/2,w,h);x.restore();x.lineWidth=4;x.strokeStyle='rgba(255,255,255,.25)';rr(-w/2,-h/2,w,h,56);x.stroke();x.restore()}
function card(X,Y,w,h,ri,rot,sc){const [nm,col]=RAR[ri];x.save();x.translate(X,Y);x.rotate(rot);x.scale(sc,sc);
  x.shadowColor=col;x.shadowBlur=60;rr(-w/2,-h/2,w,h,40);const g=x.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,col);g.addColorStop(1,'#14121c');x.fillStyle=g;x.fill();x.shadowBlur=0;x.lineWidth=8;x.strokeStyle=col;x.stroke();
  x.fillStyle='rgba(255,255,255,.9)';const n=22;for(let i=0;i<n;i++){const hh=(.25+.75*Math.abs(Math.sin(i*1.37+ri)))*h*.32;x.fillRect(-w*.38+i*(w*.76/n),-h*.12-hh/2,w*.76/n*.55,hh)}
  x.font=`900 ${w*.11}px "Inter Display"`;x.textAlign='center';x.fillStyle='#fff';x.fillText(nm.toUpperCase(),0,h*.3);x.restore()}
function counter(v){return Math.round(v).toLocaleString('fr-FR')}

/* étape : pastille numérotée + titre */
function step(n,title,t0,t,col){const a=eob(pr(t,t0,t0+.3));if(a<=0)return;x.save();x.translate(W/2,215);x.scale(.6+.4*a,.6+.4*a);x.globalAlpha=cl(a*1.4);
  x.font='900 44px "Inter Display"';const tw=x.measureText(title).width;const w=tw+150,h=96;rr(-w/2,-h/2,w,h,48);x.fillStyle='rgba(255,255,255,.12)';x.fill();x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=3;x.stroke();
  x.beginPath();x.arc(-w/2+50,0,32,0,7);x.fillStyle=col;x.fill();x.fillStyle='#120d02';x.textAlign='center';x.textBaseline='middle';x.fillText(n,-w/2+50,3);
  x.fillStyle='#fff';x.textAlign='left';x.fillText(title,-w/2+96,3);x.restore()}




let ICON=null,FIN=null;
window.ready=Promise.all([img('icon.png').then(i=>ICON=i),img('finis.jpg').then(i=>FIN=i),document.fonts.load('900 100px "Inter Display"'),document.fonts.load('700 40px "Inter Display"'),document.fonts.load('800 40px "Inter Display"'),document.fonts.load('600 40px "DejaVu Sans Mono"')]);
const SEC=window.SEC;let T0=[],acc=0;SEC.forEach(s=>{T0.push(acc);acc+=s.d});const TOTAL=acc;
const eob2=t=>{t=cl(t);const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
/* texte qui s'étire en arrivant */
function stretch(s,X,Y,size,t0,t,opt={}){const p=pr(t,t0,t0+.45);if(p<=0)return;const e=eob2(p);x.save();x.translate(X,Y);x.scale(1+(1-e)*1.4,Math.max(.05,e));x.globalAlpha=cl(p*2.2);text(s,0,0,size,{...opt,sb:opt.sb??30});x.restore()}
function subPill(s,Y,t0,t){const p=pr(t,t0,t0+.45);if(p<=0)return;const e=eob2(p);x.save();x.translate(W/2,Y);x.scale(1+(1-e)*1.2,Math.max(.05,e));x.globalAlpha=cl(p*2.2);x.font='800 50px "Inter Display"';const w=x.measureText(s).width+70,h=86;rr(-w/2,-h/2-14,w,h,43);x.fillStyle='rgba(8,8,12,.72)';x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,-12);x.restore()}
function chip(n,title,t0,t,col){const a=eob2(pr(t,t0,t0+.35));if(a<=0)return;x.save();x.translate(W/2,210);x.scale(1+(1-a)*.9,a);x.globalAlpha=cl(a*1.6);
  x.font='900 46px "Inter Display"';const tw=x.measureText(title).width,w=tw+(n?160:80),h=100;rr(-w/2,-h/2,w,h,50);x.fillStyle='rgba(10,10,14,.55)';x.fill();x.strokeStyle=col;x.lineWidth=4;x.stroke();
  if(n){x.beginPath();x.arc(-w/2+54,0,34,0,7);x.fillStyle=col;x.fill();x.fillStyle='#120d02';x.textAlign='center';x.textBaseline='middle';x.fillText(n,-w/2+54,3)}
  x.fillStyle='#fff';x.textAlign=n?'left':'center';x.textBaseline='middle';x.fillText(title,n?-w/2+102:0,3);x.restore()}
/* caméra : arrivée rapide de côté avec traînée, puis zoom lent vers la zone utile */
async function cam(srcs,s,t,lt,k){const ein=pr(lt,0,.38),e=eob2(ein),dir=k%2?-1:1;
  const z0=s.z?s.z[0]:1,z1=s.z?s.z[1]:1.08,fy=s.fy??.5;const zp=z0+(z1-z0)*(1-Math.pow(1-cl(lt/s.d),2));
  const outp=pr(lt,s.d-.22,s.d),zo=1+ei(outp)*.35;
  const w=700,h=w*844/390,X=W/2+(1-e)*dir*W*.9+Math.sin(t*.9)*6,Y=1150+Math.cos(t*.7)*5+(.5-fy)*h*(zp*zo-1);
  const rot=(1-e)*dir*-.12+Math.sin(t*.6)*.008;
  const trail=ein<1?3:0;for(let j=trail;j>=0;j--){const off=j*dir*90*(1-e);x.save();x.globalAlpha=j?.18:1-outp*.6;phone(srcs[0],X+off,Y,w,rot,1,zp*zo);
    if(srcs[1]){const m=cl((lt-s.d*.5)/.35);if(m>0&&!j)phone(srcs[1],X,Y,w,rot,m,zp*zo)}x.restore()}
  flash(outp*.35,'#fff')}
async function draw(t){x.save();let k=0;while(k+1<SEC.length&&t>=T0[k+1])k++;const s=SEC[k],lt=t-T0[k];
  if(s.kind==='hook'){bg(t,'#ff5f86');const B=s.boom,fr0=lt<B?24+288*Math.pow(lt/B,1.15):312+(lt-B)*30;const im=await fr('fev',Math.min(s.max,fr0));
    const sh=shake(t,s.boom||99,26,.5);x.translate(sh[0],sh[1]);
    const zz=1.16-.1*eo(pr(lt,0,1.2))+.06*Math.max(0,1-Math.abs(lt-(s.boom||99))*3);phone(im,W/2,1170,700,Math.sin(t*1.3)*.012,1,zz);
    stretch('FINIS-LES ?!',W/2,260,150,.05,t,{grad:['#ffffff','#ffb3c6']});
    if(lt>(s.boom||99)+.15)stretch('MYTHIQUE',W/2,1800,110,s.boom+.15,t,{grad:['#ff9db5','#ff5f86']});
    else{const a=pr(lt,.6,.9);if(a>0){x.save();x.translate(W/2,1800);x.scale(.7+.3*eob(a),.7+.3*eob(a));pill('La Fève · nouvel album',0,0,48,'#ffffff','#120d02',a);x.restore()}}
    flash(Math.max(0,1-Math.abs(lt-(s.boom||99))*5)*.7,'#fff')}
  else if(s.kind==='title'){bg(t,s.col);rays(W/2,960,t,s.col,.22);const p=pr(lt,0,.4);
    x.save();x.translate(W/2,900);x.rotate((1-eob2(p))*-.15);stretch('MISE À JOUR',0,0,160,T0[k],t,{grad:['#ffffff',s.col]});x.restore();
    stretch(s.sub,W/2,1060,62,T0[k]+.3,t,{w:800,c:'#ffffffee'});particles(t,T0[k],W/2,960,['#fff',s.col],60,1.1);flash(1-pr(lt,0,.15),'#fff')}
  else if(s.kind==='outro'){bg(t,'#5aa9ff');rays(W/2,700,t,'#ffc23d',.16);
    const a=eob2(pr(lt,0,.45));x.save();x.translate(W/2,640);x.scale(a,a);x.rotate((1-a)*.5);x.shadowColor='#ffc23d';x.shadowBlur=90;rr(-180,-180,360,360,86);x.fillStyle='#ffc23d';x.fill();x.shadowBlur=0;x.save();rr(-180,-180,360,360,86);x.clip();if(ICON)x.drawImage(ICON,-180,-180,360,360);x.restore();x.restore();
    stretch('waxdrop.fr',W/2,1010,150,T0[k]+.25,t,{grad:['#ffffff','#ffd770']});
    stretch('Tape-le dans Safari',W/2,1110,56,T0[k]+.55,t,{w:800,c:'#ffffffee'});
    const b=pr(lt,.9,1.15);if(b>0){x.save();x.translate(W/2,1235);x.scale(.6+.4*eob(b),.6+.4*eob(b));pill('Pas waxdrop.app',0,0,46,'#e5484d','#fff',b);x.restore()}
    const c2=pr(lt,1.2,1.45);if(c2>0){x.save();x.translate(W/2,1365);x.scale(.6+.4*eob(c2),.6+.4*eob(c2));pill('Gratuit · sans code ni invitation',0,0,50,'#ffffff','#120d02',c2);x.restore()}
    const d2=pr(lt,1.5,1.75);if(d2>0){const pulse=1+.04*Math.sin(t*10);x.save();x.translate(W/2,1500);x.scale(pulse,pulse);pill('Ajoute-le à ton écran d’accueil',0,0,42,'#ffc23d','#1a1200',d2);x.restore()}
    particles(t,T0[k],W/2,640,['#bfe0ff','#fff'],60,1.3);flash(1-pr(lt,0,.2),'#fff')}
  else{bg(t,s.col);const A=await img(s.img),B2=s.img2?await img(s.img2):null;await cam([A,B2],s,t,lt,k);
    chip(s.n,s.title,T0[k]+.12,t,s.col);subPill(s.sub,330,T0[k]+.35,t)}
  x.restore()}
window.TOTAL=TOTAL;window.draw=draw;
</script></body></html>
