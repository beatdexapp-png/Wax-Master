<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BeatDex</title>
<meta name="description" content="Ouvre des maxis, collectionne les sons de tes artistes préférés, complète les albums.">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeatDex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout : app plein écran sans défilement de page (en-tête, vue, barre d'onglets).
   Verre liquide sur quelques surfaces fixes posées sur un fond statique ; le contenu en aplats légers.
   Animations : uniquement transform et opacity. */
:root{
  --bg:#e8ebf1;--b1:rgba(150,170,255,.55);--b2:rgba(255,190,160,.5);--b3:rgba(140,220,200,.45);
  --fg:#12141a;--fg2:#5b6170;--gl:rgba(255,255,255,.6);--gl2:rgba(255,255,255,.3);--gb:rgba(255,255,255,.85);--gs:rgba(40,50,80,.16);--hl:rgba(255,255,255,.95);--soft:rgba(20,24,34,.07);--solid:rgba(255,255,255,.9);
  --on:#12141a;--onfg:#ffffff;
  --disp:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--b1:rgba(90,110,190,.36);--b2:rgba(150,80,120,.28);--b3:rgba(40,130,115,.28);--fg:#f1f2f6;--fg2:#979dab;--gl:rgba(255,255,255,.13);--gl2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.17);--gs:rgba(0,0,0,.45);--hl:rgba(255,255,255,.28);--soft:rgba(255,255,255,.07);--solid:rgba(28,29,35,.94);--on:#f1f2f6;--onfg:#0e0f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f12;--b1:rgba(90,110,190,.36);--b2:rgba(150,80,120,.28);--b3:rgba(40,130,115,.28);--fg:#f1f2f6;--fg2:#979dab;--gl:rgba(255,255,255,.13);--gl2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.17);--gs:rgba(0,0,0,.45);--hl:rgba(255,255,255,.28);--soft:rgba(255,255,255,.07);--solid:rgba(28,29,35,.94);--on:#f1f2f6;--onfg:#0e0f12;color-scheme:dark}
body[data-skin="graphite"],body[data-skin="encre"],body[data-skin="aube"],body[data-skin="foret"],body[data-skin="or"]{--fg:#f1f2f6;--fg2:#979dab;--gl:rgba(255,255,255,.13);--gl2:rgba(255,255,255,.04);--gb:rgba(255,255,255,.17);--gs:rgba(0,0,0,.45);--hl:rgba(255,255,255,.28);--soft:rgba(255,255,255,.07);--solid:rgba(28,29,35,.94);--on:#f1f2f6;--onfg:#0e0f12;color-scheme:dark}
body[data-skin="brume"],body[data-skin="sable"],body[data-skin="lilas"]{--fg:#12141a;--fg2:#5b6170;--gl:rgba(255,255,255,.6);--gl2:rgba(255,255,255,.3);--gb:rgba(255,255,255,.85);--gs:rgba(40,50,80,.16);--hl:rgba(255,255,255,.95);--soft:rgba(20,24,34,.07);--solid:rgba(255,255,255,.9);--on:#12141a;--onfg:#fff;color-scheme:light}
body[data-skin="graphite"]{--bg:#0e0f12;--b1:rgba(90,110,190,.36);--b2:rgba(150,80,120,.28);--b3:rgba(40,130,115,.28)}
body[data-skin="encre"]{--bg:#0a0e1c;--b1:rgba(70,90,230,.45);--b2:rgba(40,170,220,.3);--b3:rgba(120,70,200,.32)}
body[data-skin="aube"]{--bg:#160d10;--b1:rgba(230,90,110,.36);--b2:rgba(240,160,80,.28);--b3:rgba(140,60,140,.32)}
body[data-skin="foret"]{--bg:#0b120f;--b1:rgba(60,170,120,.36);--b2:rgba(150,190,80,.24);--b3:rgba(40,110,140,.3)}
body[data-skin="or"]{--bg:#12100a;--b1:rgba(210,160,60,.34);--b2:rgba(160,110,40,.3);--b3:rgba(240,210,140,.18)}
body[data-skin="brume"]{--bg:#e8ebf1;--b1:rgba(150,170,255,.55);--b2:rgba(255,190,160,.5);--b3:rgba(140,220,200,.45)}
body[data-skin="sable"]{--bg:#efe7db;--b1:rgba(230,150,110,.45);--b2:rgba(150,180,140,.45);--b3:rgba(240,210,150,.55);--fg:#1d1712;--fg2:#6d6257;--on:#1d1712}
body[data-skin="lilas"]{--bg:#ebe7f4;--b1:rgba(170,140,255,.5);--b2:rgba(255,170,210,.45);--b3:rgba(150,210,255,.45)}

html{height:100%;box-sizing:border-box;overflow:hidden}
body{height:100%;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(60% 45% at 10% 14%,var(--b1),transparent 70%),radial-gradient(55% 42% at 95% 42%,var(--b2),transparent 70%),radial-gradient(70% 48% at 35% 100%,var(--b3),transparent 70%);color:var(--fg);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:12px}
p,h1,h2,h3{margin:0}
h2{font:700 1.35rem/1.15 var(--disp);letter-spacing:-.01em;text-wrap:balance}
h3{font:700 1.05rem/1.2 var(--disp)}

/* ===== verre liquide ===== */
.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,var(--gl),var(--gl2));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl),inset 0 -1px 1px rgba(255,255,255,.05),0 14px 34px -14px var(--gs)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.2),transparent 50%)}
body.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--solid)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:var(--gl);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hl);font-weight:600;transition:transform .12s}
.gbtn.sq{width:48px;padding:0;flex:none}
.gbtn svg{width:20px;height:20px}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 24px;border-radius:999px;background:var(--on);color:var(--onfg);font:700 16px var(--disp);letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px -10px var(--gs);transition:transform .12s;white-space:nowrap}
.gbtn:active,.pbtn:active,.qk:active{transform:scale(.96)}
.pbtn[disabled],.gbtn[disabled],.qk[disabled]{opacity:.4;cursor:not-allowed}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#fff5cf,#e8b13a 52%,#a87512);box-shadow:inset 0 0 0 1.5px rgba(120,80,0,.35)}
.muted{color:var(--fg2)}

/* ===== squelette ===== */
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.wm{font:800 20px var(--disp);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.wm i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 18%,var(--fg) 20% 30%,transparent 32%),repeating-radial-gradient(circle,var(--fg) 0 1px,transparent 1px 2.5px);opacity:.9}
.jet{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 10px;border-radius:999px;font:600 14px var(--mono);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:6px 16px 0;display:flex;flex-direction:column;gap:12px;min-height:0;animation:vin .22s ease-out}
.tabs{flex:none;display:flex;gap:2px;margin:10px 16px 12px;padding:6px;border-radius:30px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:22px;color:var(--fg2);font-size:10.5px;font-weight:600;position:relative;transition:background .2s,color .2s}
.tabs svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--fg);background:var(--soft);box-shadow:inset 0 1px 0 var(--hl)}
.dot{position:absolute;top:5px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:#ff5f86}
.vh{flex:none;display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;flex:none}
.seg button{height:38px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
.cnt{margin-left:auto;font:600 13px var(--mono);color:var(--fg2);white-space:nowrap}
.fdot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:#ff5f86}
.empty{margin:auto;color:var(--fg2)}

/* ===== OUVRIR ===== */
.v-open{align-items:center;gap:14px;padding-bottom:4px}
.evp{flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;max-width:100%}
.evp span{font-family:var(--mono);color:var(--fg2);white-space:nowrap}
.evp b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldot{width:7px;height:7px;border-radius:50%;background:#ff5f86;flex:none;animation:pulse 1.6s ease-in-out infinite}
.mbox{flex:1;min-height:0;width:100%;display:grid;place-items:center;container-type:size;cursor:pointer}
.maxi{position:relative;width:min(74cqw,88cqh,400px);aspect-ratio:1;transform:translateX(-7%);container-type:inline-size}
.mv{position:absolute;inset:3%;border-radius:50%;background:repeating-radial-gradient(circle,#111216 0 .55cqw,#1e1f26 .55cqw 1.1cqw);transform:translateX(17%);transition:transform .5s cubic-bezier(.3,1.3,.5,1);box-shadow:0 2cqw 6cqw rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
.mv::after{content:"";position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#000 0 7%,transparent 8%),var(--lc,#c9c3b5)}
.mbox:hover .mv{transform:translateX(24%) rotate(30deg)}
.ms{position:absolute;inset:0;border-radius:3cqw;overflow:hidden;-webkit-mask:radial-gradient(circle closest-side,transparent 0 21%,#000 22%);mask:radial-gradient(circle closest-side,transparent 0 21%,#000 22%)}
.ms b{position:absolute;left:8cqw;top:7cqw;font:800 15cqw/.86 var(--disp);letter-spacing:-.03em}
.ms span{position:absolute;left:8cqw;bottom:7cqw;font:500 3.6cqw var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--fg2)}
.ms em{position:absolute;right:8cqw;bottom:7cqw;font:500 3.6cqw var(--mono);letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--fg2)}
.obar{flex:none;display:flex;gap:10px;width:min(100%,420px)}
.obar .pbtn{flex:1}
.cap{flex:none;font-size:12.5px;color:var(--fg2);min-height:1.2em;text-align:center}
.cap b{font-family:var(--mono);font-weight:600;color:var(--fg)}
.quick{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,420px)}
.qk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px 9px;border-radius:22px;font-size:12.5px;font-weight:600;transition:transform .12s}
.qk svg{width:22px;height:22px}
.qk em{position:absolute;top:7px;right:10px;font:600 11px var(--mono);font-style:normal;color:var(--fg2)}
.qk em.ok{color:#1ed760}

/* ===== tuiles (titres) ===== */
.it{display:block;width:100%;height:100%;border-radius:8%}
.tile{position:relative;width:100%;aspect-ratio:1;border-radius:8%;overflow:hidden;container-type:inline-size;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tx{position:absolute;left:0;right:0;bottom:0;padding:24cqw 7cqw 6.5cqw;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.66));color:#fff;display:flex;flex-direction:column;gap:1.4cqw;text-align:left}
.tx b{font:700 11.5cqw/1.06 var(--disp);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx span{font:500 9cqw/1.1 var(--body);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{position:absolute;left:7cqw;top:7cqw;width:7cqw;height:7cqw;border-radius:50%;background:var(--rc);box-shadow:0 0 0 1.5cqw rgba(0,0,0,.28)}
.tc{position:absolute;right:6cqw;top:5.5cqw;font:600 8.5cqw var(--mono);padding:.8cqw 4cqw;border-radius:9cqw;background:rgba(0,0,0,.45);color:#fff;font-style:normal}
.tile.lk{filter:saturate(0) brightness(.62);opacity:.5}

/* ===== albums & disque de platine ===== */
.alb,.plq{position:relative;width:100%;aspect-ratio:1;container-type:inline-size}
.alc{position:absolute;left:0;top:5%;width:86%;aspect-ratio:1;border-radius:3cqw;overflow:hidden;z-index:1;box-shadow:0 2cqw 5cqw rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.12)}
.alc span{position:absolute;left:7cqw;top:7cqw;right:7cqw;font:800 9.5cqw/.95 var(--disp);color:#fff;text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.alc i{position:absolute;left:7cqw;bottom:6cqw;font:500 6cqw var(--body);font-style:normal;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.35);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alv{position:absolute;left:5%;top:7%;width:82%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111216 0 .9cqw,#1e1f26 .9cqw 1.8cqw);transition:transform .5s cubic-bezier(.3,1.3,.5,1);box-shadow:0 1cqw 3cqw rgba(0,0,0,.4)}
.alv::after{content:"";position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,#000 0 7%,transparent 8%),var(--lab)}
.alb.ok .alv{transform:translateX(17%)}
.alb:not(.ok) .alc{filter:saturate(.12) brightness(.66)}
.badge{position:absolute;right:18%;bottom:8%;z-index:2;font:600 11px var(--mono);padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.plq .badge{right:8%}
.pfm{position:absolute;inset:3%;border-radius:3cqw;background:linear-gradient(145deg,#2a2b31,#111216);box-shadow:0 2cqw 5cqw rgba(0,0,0,.35),inset 0 0 0 1.5cqw #1b1c21,inset 0 0 0 1.9cqw rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw}
.pdk{position:relative;width:58cqw;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 30deg,#eef1f5,#9aa3ad,#f8fafc,#8c95a0,#eef1f5,#a7b0ba,#f8fafc,#9aa3ad,#eef1f5);box-shadow:0 1cqw 3cqw rgba(0,0,0,.5)}
.pdk::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,0) 0 .8cqw,rgba(0,0,0,.06) .8cqw 1.2cqw)}
.pdk i{position:absolute;inset:34%;border-radius:50%;z-index:1;box-shadow:0 0 0 .5cqw rgba(0,0,0,.25)}
.ppl{background:linear-gradient(#e0e4e8,#aeb5bd);color:#15171b;border-radius:1cqw;padding:1.6cqw 4cqw;text-align:center;line-height:1.1;max-width:86%}
.ppl b{display:block;font:700 5.4cqw var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppl span{font:500 3.4cqw var(--mono);letter-spacing:.12em;text-transform:uppercase}
.plq:not(.ok) .pfm{filter:grayscale(1) brightness(.6)}

/* ===== pager ===== */
.pgr{flex:1;min-height:0;position:relative}
.pgt{height:calc(100% - 24px);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pgt::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;display:grid;align-content:center;scroll-snap-align:start;scroll-snap-stop:always}
.pgi{height:24px;display:flex;justify-content:center;align-items:center;gap:6px;font:600 12px var(--mono);color:var(--fg2)}
.pgi i{width:6px;height:6px;border-radius:50%;background:var(--fg2);opacity:.35;transition:opacity .2s,transform .2s}
.pgi i.on{opacity:1;transform:scale(1.3)}

/* ===== platine (collection) ===== */
.ttw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.ttc{flex:none;width:min(42vw,25vh,220px)}
.tti{flex:none;font:600 12px var(--mono);color:var(--fg2);min-height:1.2em}
.ttv{flex:1;min-height:0;width:100%;display:grid;place-items:center;container-type:size}
.vin{position:relative;width:min(86cqw,96cqh,420px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;padding:3%}
.vin:active{cursor:grabbing}
.vinr{position:absolute;inset:3%;border-radius:50%;will-change:transform;background:repeating-radial-gradient(circle,#111216 0 2px,#1e1f26 2px 4px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.vinr::before{content:"";position:absolute;left:49.2%;top:4%;width:1.6%;height:10%;border-radius:2px;background:rgba(255,255,255,.22)}
.vlab{position:absolute;inset:33%;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.vlab::after{content:"";position:absolute;left:46%;top:46%;width:8%;height:8%;border-radius:50%;background:#000}
.vsh{position:absolute;inset:6%;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 6%,rgba(255,255,255,.1) 10%,transparent 14% 50%,rgba(255,255,255,.07) 56%,transparent 61%)}
.ttbar{flex:none;display:flex;gap:8px;align-items:center;width:min(100%,420px);padding:6px;border-radius:999px}
.ttbar .gbtn{height:42px;width:42px}
.scrub{flex:1;min-width:0;accent-color:var(--fg)}

/* ===== rappeurs ===== */
.search{flex:1;min-width:0;height:46px;padding:0 16px 0 40px;border-radius:999px;outline:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%23888' stroke-width='2'><circle cx='8' cy='8' r='6'/><path d='M12.5 12.5 17 17'/></svg>"),linear-gradient(180deg,var(--gl),var(--gl2));background-repeat:no-repeat;background-position:14px 50%,0 0}
.search::placeholder{color:var(--fg2)}
.bubw{flex:1;min-height:0;border-radius:30px;overflow:hidden;touch-action:pan-y;margin-bottom:2px}
.bb{position:absolute;left:0;top:0;border-radius:50%;padding:2.5px;will-change:transform;cursor:grab;touch-action:none;background:conic-gradient(var(--fg) calc(var(--p)*1%),var(--soft) 0);transition:opacity .3s}
.bb.done{background:conic-gradient(#e9c46a,#fff3c8,#e9c46a)}
.bb>span{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--avg);color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.35);box-shadow:inset 0 2px 6px rgba(255,255,255,.25),inset 0 -6px 14px rgba(0,0,0,.18)}
.bb b{font-family:var(--disp);font-weight:800;line-height:1}
.bb em{font:600 10px var(--mono);font-style:normal;opacity:.9;margin-top:2px}
.bb.dim{opacity:.12}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--disp);color:#fff;background:var(--avg);flex:none;text-shadow:0 1px 4px rgba(0,0,0,.35)}

function pager(host,items,fn,o){
  if(!host)return;const gap=o.gap??10;const w=host.clientWidth,h=host.clientHeight-24;if(w<=0||h<=0)return;
  if(!items.length){host.innerHTML=`<p class="empty">${o.empty||'Rien ici'}</p>`;return}
  let cols,cw,ch;
  if(o.cellH){cols=o.cols||Math.max(1,Math.floor((w+gap)/((o.minW||320)+gap)));cw=(w-gap*(cols-1))/cols;ch=o.cellH}
  else{cols=Math.max(o.minCols||3,Math.floor((w+gap)/(o.minT+gap)));cw=(w-gap*(cols-1))/cols;ch=cw+(o.extra||0)}
  const rows=Math.max(1,Math.floor((h+gap)/(ch+gap)));const per=cols*rows;const P=Math.ceil(items.length/per);
  host.innerHTML=`<div class="pgt">${Array.from({length:P},()=>`<div class="pg" style="grid-template-columns:repeat(${cols},${cw.toFixed(1)}px);grid-auto-rows:${ch.toFixed(1)}px;gap:${gap}px"></div>`).join('')}</div><div class="pgi">${P>1?(P<=12?Array.from({length:P},(_,i)=>`<i class="${i?'':'on'}"></i>`).join(''):`<span>1 / ${P}</span>`):''}</div>`;
  const pages=host.querySelectorAll('.pg'),done=new Set();
  const fill=i=>{if(i<0||i>=P||done.has(i))return;done.add(i);pages[i].innerHTML=items.slice(i*per,(i+1)*per).map(fn).join('')};
  fill(0);fill(1);
  const tr=host.querySelector('.pgt'),ind=host.querySelector('.pgi');let raf=0,last=0;
  tr.addEventListener('scroll',()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));fill(i-1);fill(i);fill(i+1);
    if(P<=12)ind.querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===i));else if(ind.firstChild)ind.firstChild.textContent=`${i+1} / ${P}`})},{passive:true});
  tr.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)||P<2)return;e.preventDefault();const t=performance.now();if(t-last<350)return;last=t;tr.scrollBy({left:Math.sign(e.deltaY)*tr.clientWidth,behavior:'smooth'})},{passive:false});
}

const BB={nodes:[],raf:0,drag:null,calm:0,w:0,h:0};
function initBub(){
  const el=$('bub');if(!el)return;const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;BB.w=w;BB.h=h;
  const list=colList();if(!list.length)return;
  const r0=list.map(A=>14+7*Math.sqrt(A.ids.filter(own).length+2));const area=r0.reduce((a,r)=>a+Math.PI*r*r,0)||1;
  const k=Math.min(1.7,Math.sqrt(.45*w*h/area));
  BB.nodes=list.map((A,i)=>{const r=clamp(r0[i]*k,22,86);const p=pct(A.ids);const b=document.createElement('button');
    b.className='bb'+(S.ul[A.key]?' done':'');b.setAttribute('aria-label',`${A.n}, ${p} %`);
    b.style.cssText=`width:${2*r}px;height:${2*r}px;--avg:${A.avg};--p:${p}`;
    b.innerHTML=`<span><b style="font-size:${Math.max(12,r*.4).toFixed(0)}px">${esc(A.ini)}</b>${r>=34?`<em>${p}%</em>`:''}</span>`;
    el.appendChild(b);const a=i*2.4,d=Math.sqrt(i)*17;
    const nd={el:b,A,r,x:clamp(w/2+Math.cos(a)*d,r,w-r),y:clamp(h/2+Math.sin(a)*d,r,h-r),vx:0,vy:0};b.style.transform=`translate3d(${nd.x-r}px,${nd.y-r}px,0)`;return nd});
  BB.calm=0;bKick();
}
function bStep(){
  const n=BB.nodes,w=BB.w,h=BB.h,cx=w/2,cy=h/2,dg=BB.drag&&BB.drag.n;let e=0;
  for(const a of n){if(a===dg)continue;a.vx+=(cx-a.x)*.0016;a.vy+=(cy-a.y)*.0022}
  for(let i=0;i<n.length;i++){const a=n[i];for(let j=i+1;j<n.length;j++){const b=n[j];const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r+3;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;const d2=dx*dx+dy*dy;if(d2>=m*m)continue;const d=Math.sqrt(d2)||.01,o=(m-d)/2,nx=dx/d,ny=dy/d;
    if(a!==dg){const f=b===dg?2:1;a.x-=nx*o*f;a.y-=ny*o*f;a.vx-=nx*o*.12;a.vy-=ny*o*.12}
    if(b!==dg){const f=a===dg?2:1;b.x+=nx*o*f;b.y+=ny*o*f;b.vx+=nx*o*.12;b.vy+=ny*o*.12}}}
  for(const a of n){if(a!==dg){a.vx*=.86;a.vy*=.86;a.x+=a.vx;a.y+=a.vy}a.x=clamp(a.x,a.r,w-a.r);a.y=clamp(a.y,a.r,h-a.r);e+=a.vx*a.vx+a.vy*a.vy;a.el.style.transform=`translate3d(${(a.x-a.r).toFixed(1)}px,${(a.y-a.r).toFixed(1)}px,0)`}
  BB.calm=e<.05&&!BB.drag?BB.calm+1:0;BB.raf=BB.calm>40||!$('bub')?0:requestAnimationFrame(bStep);
}
function bKick(){BB.calm=0;if(!BB.raf)BB.raf=requestAnimationFrame(bStep)}

function drawCard(minR=0,bo){
  const e=liveEv();const w=RAR.map((R,i)=>R.drop*((bo&&bo[i])||1));if(e&&e.fx.divin)w[5]*=e.fx.divin;
  let roll=Math.random()*w.slice(minR).reduce((a,b)=>a+b,0),r=minR;
  for(let i=minR;i<RAR.length;i++){roll-=w[i];if(roll<=0){r=i;break}}
  const pool=POOL[r];const top=S.spot?S.spot.top:[];
  const ww=pool.map(c=>{let m=GW[c.g]||1;if(e){const f=e.fx;if(f.artists&&f.artists.includes(c.a))m*=f.mult;if(f.genre&&f.genre===c.g)m*=f.mult}if(top.includes(c.ak))m*=2;return m});
  let t=Math.random()*ww.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){t-=ww[i];if(t<=0)return pool[i]}return pool[pool.length-1];
}
function checkUnlocks(){const out=[];
  ALBUMS.forEach(A=>{if(!S.ul[A.key]&&A.ids.every(own)){S.ul[A.key]=1;S.coins+=ALB_BONUS;addXP(100);out.push(A)}});
  ARTISTS.forEach(A=>{if(!S.ul[A.key]&&A.ids.every(own)){S.ul[A.key]=1;S.coins+=ART_BONUS;addXP(300);out.push(A)}});return out}

  if(m==='free'){if(S.bonus>0){S.bonus--;return true}if(freeReady()){S.freeAt=now()+freeMs();return true}return false}if(S.coins<cost())return false;S.coins-=cost();return true}
const SPP=[0,.08,.22,.45,.6,.8];
function pull(kind){
  S.packs++;const base=new Set(Object.keys(S.owned).filter(k=>S.owned[k]>0));let cards;
  if(kind==='drop'){const dp=curDrop();const ids=dp.A.ids.slice();cards=[];for(let k=0;k<3&&ids.length;k++)cards.push(C[ids.splice(Math.floor(Math.random()*ids.length),1)[0]]);cards.sort((a,b)=>a.r-b.r);
    S.drop[dp.w]=(S.drop[dp.w]||0)+1;const last=cards[cards.length-1];S.ser[last.id]=Math.min(DROP_LIMIT,(hash('ds'+dp.w)%120)+Math.floor((now()-dp.w*48*3600e3)/(48*3600e3)*260)+S.drop[dp.w])}
  else if(PK[kind]){const P=PK[kind];cards=[0,1,2,3].map(()=>drawCard(P.min,P.b));cards.push(drawCard(P.last,P.b));cards.sort((a,b)=>a.r-b.r)}
  else cards=[drawCard(),drawCard(),drawCard(),drawCard(),drawCard(1)].sort((a,b)=>a.r-b.r);
  const seen=new Set();
  const res=cards.map(c=>{const isNew=!own(c.id)&&!seen.has(c.id);seen.add(c.id);S.owned[c.id]=(S.owned[c.id]||0)+1;
    let sp=null;if(c.r>=1&&Math.random()<SPP[c.r]){const at=Math.floor(Math.random()*c.r),to=at+1;const opts=['scratch'];if(to>=2)opts.push('fake');if(to>=3)opts.push('faceb');if(at+2<=c.r)opts.push('rewind');sp={at,kind:opts[Math.floor(Math.random()*opts.length)]}}
    return{c,isNew,sp}});
  const secret=!!PK[kind]||(kind!=='drop'&&Math.random()<1/40);const gain=secret&&kind==='std'?100:0;
  const nn=res.filter(x=>x.isNew).length;const d=day();d.open++;d.newT+=nn;addXP(20+10*nn);
  S.coins+=gain;const ul=checkUnlocks();save();setCoins();
  return{res,i:0,lv:0,ul,gain,stage:'seal',secret,kind,base};
}

  const R=Math.random;let r=R()<.5?1:R()<.6?2:R()<.6?3:R()<.6?4:R()<.85?0:5;const pool=POOL[r];const c=pool[Math.floor(R()*pool.length)];
  const V=valOf(c);const len=(4+R()*22)*60e3;S.mk.seq++;
  return{id:'l'+S.mk.seq,cid:c.id,seller:PSEUDOS[Math.floor(R()*PSEUDOS.length)],cur:Math.max(5,Math.round(V*(.35+R()*.3))),lead:null,h:null,myBid:0,bids:0,t0,ends:t0+len,max:Math.round(V*(.75+R()*1.1)),heat:.4+R()*.6,mine:false};
}
function hp(l,v){if(!l.h)l.h=[l.cur];l.h.push(v);if(l.h.length>14)l.h.splice(1,1)}
const chg=l=>{const s0=l.h?l.h[0]:l.cur;return Math.round((l.cur/s0-1)*100)};
function spark(l,cls){const h=l.h&&l.h.length>1?l.h:[l.cur,l.cur];const mn=Math.min(...h),mx=Math.max(...h),sp=mx-mn||1;const pts=h.map((v,i)=>`${(i/(h.length-1)*100).toFixed(1)},${(30-(v-mn)/sp*26).toFixed(1)}`).join(' ');return `<svg class="${cls||'spk'}" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`}
const chgHTML=l=>{const v=chg(l);return `<span class="chg${v>0?' gn':''}">${v>0?'▲ ':''}${v} %</span>`};
function mkInit(){if(!S.mk||!Array.isArray(S.mk.list))S.mk={list:[],seq:0,t:now()}}
function mkStep(t){
  const M=S.mk;const notes=[];
  for(const l of M.list){if(l.done)continue;
    if(t>=l.ends){l.done=true;const c=C[l.cid];
      if(l.mine){if(l.lead){S.coins+=l.cur;notes.push(`${c.t} vendu ${l.cur} jetons`)}else{S.owned[l.cid]=(S.owned[l.cid]||0)+1;notes.push(`${c.t} invendu, rendu`)}}
      else if(l.lead==='me'){S.owned[l.cid]=(S.owned[l.cid]||0)+1;notes.push(`Remporté : ${c.t}`);checkUnlocks()}
      continue}
    const prog=clamp((t-l.t0)/(l.ends-l.t0),0,1);
    if(Math.random()<l.heat*(.05+.35*prog*prog)){const nb=nextBid(l);if(nb<=l.max){
      if(l.lead==='me'){S.coins+=l.myBid;l.myBid=0;notes.push(`Surenchère sur ${C[l.cid].t}`)}
      hp(l,nb);l.cur=nb;l.lead='bot';l.bids++}}
  }
  M.list=M.list.filter(l=>!l.done);
  const pub=M.list.filter(l=>!l.mine).length;for(let k=pub;k<10;k++)M.list.push(mkNew(t));
  M.t=t;return notes;
}

  return `<div class="lr wx${v>0?' gn':''}" data-lid="${l.id}">${spark(l,'spk')}<button class="lth" data-act="see" data-id="${c.id}" aria-label="${esc(c.t)}">${tileHTML(c,{nocount:1,lock:false})}</button><div class="li"><b>${esc(c.t)}</b><span><i style="background:${R.c}"></i>${esc(c.a)}</span><small>${chgHTML(l)} · <span class="ltm">${clock(l.ends-now())}</span></small></div><div class="lp"><b class="lcur">${l.cur} ${coinI}</b><small>${l.mine?'Ta vente':esc(l.seller)}</small></div>${btn}</div>`}

  let b='';const p=menuPage;

    b=top('')+`<div class="mlist">${mi('compte','#30a46c',ICON.check,'Compte',window.CL&&CL.user?(CL.pseudo||'Connecté'):'Sauvegarde en ligne')}${mi('events','#d6336c',ICON.cal,'Événements',e?'En cours':'')}${mi('!cat','#2b8a3e',ICON.search,'Catalogue',`${ARTISTS.length} rappeurs`)}${mi('themes','#5b6cff',ICON.theme,'Thèmes',sk?sk[1]:'')}${mi('rar','#e9a23b',ICON.gem,'Raretés','')}${mi('code','#ff7a3d',ICON.gift,'Code','')}${mi('how','#3a8dde',ICON.help,'Aide','')}${mi('set','#7c8494',ICON.gear,'Réglages','')}</div>`}
  else if(p==='compte'){b=top('Compte')+(window.CL?CL.page():'<p class="cap">Indisponible hors ligne</p>')}
  else if(p==='events'){b=top('Événements')+`<h2>Événements</h2>`+EVENTS.filter(x=>evState(x)!=='past').sort((a,b)=>new Date(a.s)-new Date(b.s)).map(x=>{const st=evState(x);return `<div class="evc"><i class="sw2" style="--evbg:${x.bg}"></i><div><b>${x.n}</b><small>${x.d}</small></div><em>${st==='live'?`<span data-until="${x.e}">${dur(new Date(x.e)-now())}</span>`:fdate(x.s)}</em></div>`}).join('')}
  else if(p==='themes'){b=top('Thèmes')+`<div class="skins">${SKINS.map(([id,n,pp])=>{const lk=pp&&!hasPass();return `<button class="skin" data-act="${lk?'needpass':'skin'}" data-s="${id}" aria-pressed="${S.set.skin===id}"><span class="pv" style="--pv:${SKPV[id]}"><i></i>${lk?'<u>Pass</u>':''}</span>${n}</button>`}).join('')}</div>`}
  else if(p==='rar'){b=top('Raretés')+`<div class="mlist">${RAR.map((R,i)=>{const d=i===5&&e&&e.fx.divin?R.drop*e.fx.divin:R.drop;return `<div class="set"><span style="display:flex;align-items:center;gap:10px"><i style="width:10px;height:10px;border-radius:50%;background:${R.c}"></i><span><b>${R.n}</b><br><small class="muted">${R.d}</small></span></span><span style="font:600 13px var(--mono);text-align:right">${d} %<br><small class="muted">${POOL[i].filter(c=>own(c.id)).length}/${POOL[i].length}</small></span></div>`}).reverse().join('')}</div><p class="cap" style="text-align:left">Le rap français tombe plus souvent. ↑ = son en hausse cette semaine.</p>`}
  else if(p==='code'){b=top('Code')+`<form class="codef" id="codef"><input id="code" placeholder="CODE" autocomplete="off" aria-label="Code bonus"><button class="pbtn" type="submit" style="height:48px">OK</button></form><p class="msg" id="cmsg"></p>`}
  else if(p==='how'){b=top('Aide')+`<div class="prose"><p><b>Maxi</b> · 5 sons, gratuit toutes les ${hasPass()?'5':'10'} min.</p><p><b>Touche le vinyle</b> : il accélère, et change de couleur si la rareté monte.</p><p><b>Collection</b> · un rappeur, puis un album, puis ses sons.</p><p><b>Doubles</b> · vends-les à la Bourse ou recycle-les en poussière pour fabriquer un son manquant.</p><p><b>Profil</b> · missions du jour, saison, classement des joueurs.</p></div>`}
  else if(p==='set'){b=top('Réglages')+`<div class="mlist"><div class="set"><b>Mode économie</b><button class="sw" role="switch" aria-checked="${!!S.set.lite}" data-act="lite" aria-label="Mode économie"></button></div><div class="set"><b>Réinitialiser</b><button class="gbtn" style="height:38px${resetArm?';background:#e5484d;color:#fff;border-color:#e5484d':''}" data-act="reset">${resetArm?'Confirmer':'Effacer'}</button></div></div>`}
  sh.innerHTML=`<div class="scrim" data-act="mclose"></div><div class="sheet glass" role="dialog" aria-label="Menu">${b}</div>`;
}

/* ================= INTERACTIONS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){closeMenu();closeStack();closeDD();if(t.dataset.tab==='shop'&&tab==='shop')shopSub='hub';setTab(t.dataset.tab);return}
  const a=t.dataset.act;
  switch(a){
    case 'open':openPack(t.dataset.m);break;
    case 'opengold':openPack('gold');break;
    case 'opendrop':openPack('drop');break;
    case 'openall':openPack(canFree()?'free':'pay',true);break;
    case 'op':opTap();break;
    case 'skipall':if(reveal)showSummary();break;
    case 'done':closeOv();break;
    case 'again':{hardStop();ov.innerHTML='';reveal=null;openPack(canFree()?'free':'pay');break}
    case 'unlocks':showUnlock(0);break;
    case 'unext':showUnlock(+t.dataset.i);break;
    case 'share':share();break;
    case 'copycap':{const cap=t.dataset.cap;try{navigator.clipboard.writeText(cap).then(()=>toast('Légende copiée'),()=>toast(cap))}catch(_){toast(cap)}break}
    case 'spot':closeMenu();spotFlow();break;
    case 'spotoff':S.spot=null;save();closeDD();toast('Spotify déconnecté');render();break;
    case 'claim':claim();break;
    case 'colv':colView=t.dataset.v;render();break;
    case 'colg':colG=t.dataset.v;render();break;
    case 'cat':closeMenu();closeDD();stack=[{type:'cat'}];renderStack();break;
    case 'cats':catScope=t.dataset.v;renderStack(true);break;
    case 'catg':catG=t.dataset.v;renderStack(true);break;
    case 'cato':catOwn=t.dataset.v;renderStack(true);break;
    case 'artist':case 'goartist':closeDD();pushPage({type:'artist',k:t.dataset.k});break;
    case 'album':case 'goalbum':closeDD();pushPage({type:'album',k:t.dataset.k});break;
    case 'pop':popPage();break;
    case 'closestack':closeStack();break;
    case 'see':see(t.dataset.id);break;
    case 'seeal':seeAl(t.dataset.k);break;
    case 'seepl':seePl(t.dataset.k);break;
    case 'ddclose':closeDD();break;
    case 'fav':{const id=t.dataset.id;const i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else{if(S.fav.length>=6){toast('6 favoris maximum');break}S.fav.push(id)}save();see(id);if(tab==='profil')render();break}
    case 'craft':craft(t.dataset.id);break;
    case 'recy1':recyOne(t.dataset.id);break;
    case 'recy':recySheet();break;
    case 'recyall':recyAll();break;
    case 'soon':toast('Bientôt disponible');break;
    case 'shs':shopSub=t.dataset.v;render();break;
    case 'mks':mkSub=t.dataset.v;render();break;
    case 'jts':jetSub=t.dataset.v;render();break;
    case 'bid':bid(t.dataset.l);break;
    case 'sell':sellSheet(t.dataset.id);break;
    case 'sellfrom':closeDD();closeStack();tab='shop';shopSub='encheres';mkSub='sell';render();sellSheet(t.dataset.id);break;
    case 'sp':case 'sd':t.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===t));break;
    case 'list':listCard(t.dataset.id);break;
    
    case 'tget':case 'tgive':tradePick(t);break;
    case 'tgo':tradeGo();break;
    case 'gojet':closeMenu();closeStack();closeDD();tab='shop';shopSub='jetons';jetSub='packs';setTab('shop');break;
    case 'buy':toast('Bientôt disponible');break;
    case 'buyok':buyOk(t.dataset.k);break;
    case 'buyc':buyCoins(t.dataset.k);break;
    case 'passoff':S.pass=null;applySkin();save();toast('Pass résilié');render();break;
    case 'gopass':case 'needpass':closeMenu();tab='shop';shopSub='pass';render();if(a==='needpass')toast('Réservé au BeatDex Pass');break;
    case 'prs':profSub=t.dataset.v;render();break;
    case 'mclaim':mClaim(t.dataset.k);break;
    case 'sclaim':sClaim(t.dataset.i,t.dataset.t);break;
    case 'menu':openMenu(t.dataset.p);break;
    case 'mclose':closeMenu();break;
    case 'mpage':menuPage=t.dataset.p||'';resetArm=false;renderMenu();break;
    case 'skin':S.set.skin=t.dataset.s;save();applySkin();renderMenu();break;
    case 'lite':S.set.lite=!S.set.lite;save();applySkin();renderMenu();break;
    case 'reset':if(!resetArm){resetArm=true;renderMenu()}else{resetArm=false;S=fresh();save();closeMenu();closeStack();setTab('ouvrir');toast('Progression effacée')}break;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='codef')return;e.preventDefault();
  const v=$('code').value.trim().toUpperCase(),m=$('cmsg');
  if(!CODES[v]){m.textContent='Code inconnu';m.style.color='#e5484d';return}
  if(S.codes[v]){m.textContent='Déjà utilisé';m.style.color='#e5484d';return}
  S.codes[v]=1;S.coins+=CODES[v];save();m.textContent=`+${CODES[v]} jetons`;m.style.color='#30a46c';setCoins();
});
let qT=0;
document.addEventListener('input',e=>{if(e.target.id==='cq'){catQ=e.target.value;clearTimeout(qT);qT=setTimeout(catPager,140)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(dd.innerHTML)closeDD();else if(sh.innerHTML)closeMenu();else if(stack.length)popPage();return}
  if(reveal&&!dd.innerHTML&&$('op')&&reveal.stage!=='sum'&&(e.key===' '||e.key==='Enter')){e.preventDefault();opTap();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act=open]')){e.preventDefault();openPack(e.target.dataset.m)}
});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.bb');if(!b)return;const node=BB.nodes.find(x=>x.el===b);if(!node)return;const r=$('bub').getBoundingClientRect();
  BB.drag={n:node,ox:e.clientX-r.left-node.x,oy:e.clientY-r.top-node.y,moved:0,lx:e.clientX,ly:e.clientY,id:e.pointerId,rect:r};try{b.setPointerCapture(e.pointerId)}catch(_){}bKick()});
document.addEventListener('pointermove',e=>{const g=BB.drag;if(g&&e.pointerId===g.id){const n=g.n;n.x=e.clientX-g.rect.left-g.ox;n.y=e.clientY-g.rect.top-g.oy;n.vx=(e.clientX-g.lx)*.6;n.vy=(e.clientY-g.ly)*.6;g.lx=e.clientX;g.ly=e.clientY;g.moved+=Math.abs(n.vx)+Math.abs(n.vy);bKick()}},{passive:true});
function pEnd(e){const g=BB.drag;if(g&&e.pointerId===g.id){BB.drag=null;if(g.moved<8&&e.type==='pointerup')pushPage({type:'artist',k:g.n.A.key});bKick()}}
document.addEventListener('pointerup',pEnd);document.addEventListener('pointercancel',pEnd);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{stopBub();if($('bub'))$('bub').querySelectorAll('.bb').forEach(x=>x.remove());layout()},160)});
let tickN=0;setInterval(()=>{const ch=(++tickN%2===0)&&mkTick();if(ch&&tab==='shop'&&(shopSub==='encheres'||shopSub==='hub')&&!ov.innerHTML&&!sh.innerHTML)render();else mkPaint();
  document.querySelectorAll('[data-clock]').forEach(el=>{el.textContent=clock(+el.dataset.clock-now())});
  if(tab==='ouvrir'&&!ov.innerHTML&&!sh.innerHTML&&!dd.innerHTML&&!dt.innerHTML){const fc=$('freecap');if(fc&&freeReady()&&fc.querySelector('[data-clock]'))render()}},1000);
setInterval(()=>{document.querySelectorAll('[data-until]').forEach(el=>{el.textContent=dur(new Date(el.dataset.until)-now())})},15000);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applySkin)}catch(_){}

mkInit();mkTick();render();

</script>

<script>
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});
  if(standalone)return;
  var seen=false;try{seen=localStorage.getItem('bd-inst-skip')==='1'}catch(e){}
  var box=document.getElementById('inst'),btn=document.getElementById('ibtn'),ios=document.getElementById('iios'),dp=null;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!seen)box.hidden=false;
  if(isIOS)ios.hidden=false;
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;btn.hidden=false;if(!seen)box.hidden=false});
  btn.addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(r){if(r.outcome==='accepted')box.hidden=true;dp=null;btn.hidden=true})});
  addEventListener('appinstalled',function(){box.hidden=true});
  document.getElementById('iskip').addEventListener('click',function(){box.hidden=true;try{localStorage.setItem('bd-inst-skip','1')}catch(e){}});
})();
</script>
