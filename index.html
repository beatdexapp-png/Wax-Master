<meta name="mobile-web-app-capable" content="yes">

<body>

<div id="app">
  <header class="hd"><div class="wm"><i></i>WaxDrop</div><button class="jet glass" id="coins" data-act="gojet" aria-label="Jetons, ouvrir le shop"></button></header>
  <main id="main"></main>
  <nav class="tabs glass" id="tabs">
    <button data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="9" r="4.5"/><circle cx="17" cy="15" r="3.5"/><circle cx="9.5" cy="18.5" r="2"/></svg>Collection</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Disquaire<i class="dot" id="shdot" hidden></i></button>
    <button data-tab="ouvrir" class="tcen" aria-label="Ouvrir un maxi"><span class="tcv" aria-hidden="true"></span><span class="tcl">Ouvrir</span><i class="dot" id="odot" hidden></i></button>
    <button data-tab="bourse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-5 3.5 3L19 6"/><path d="M15 6h4v4"/></svg>Bourse<i class="dot" id="pdot" hidden></i></button>
    <button data-tab="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4.2 4.3-6 8-6s6.8 1.8 8 6"/></svg>Profil</button>
  </nav>
</div>
<div id="dt"></div><div id="sh"></div><div id="ov"></div><div id="dd"></div>

<script src="/data.js"></script>
<script src="/catalog.js"></script>
<script src="/app.js"></script>


<div id="inst" hidden role="dialog" aria-label="Installer WaxDrop">
  <div class="ivn" aria-hidden="true"></div>
  <h1>WaxDrop</h1>
  <p id="itx">Installe l’app sur ton écran d’accueil pour ouvrir tes maxis en plein écran.</p>
  <button class="ib" id="ibtn" hidden>Installer WaxDrop</button>
  <ol id="iios" hidden><li>Touche <b>Partager</b> en bas de Safari</li><li>Choisis <b>Sur l’écran d’accueil</b></li><li>Ouvre <b>WaxDrop</b> depuis ton écran</li></ol>
  <button class="il" id="iskip">Continuer dans le navigateur</button>
</div>
<script>
(function(){
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});
  if(standalone)return;
  var seen=false;try{seen=localStorage.getItem('bd-inst-skip')==='1'}catch(e){}
  var box=document.getElementById('inst'),btn=document.getElementById('ibtn'),ios=document.getElementById('iios'),dp=null;
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!seen)box.hidden=false;
  if(isIOS)ios.hidden=false;
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;btn.hidden=false;if(!seen)box.hidden=false});
  btn.addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(r){if(r.outcome==='accepted')box.hidden=true;dp=null;btn.hidden=true})});
  addEventListener('appinstalled',function(){box.hidden=true});
  document.getElementById('iskip').addEventListener('click',function(){box.hidden=true;try{localStorage.setItem('bd-inst-skip','1')}catch(e){}});
})();
</script>
<script src="/vendor/supabase.js"></script>
<script src="/cloud.js"></script>
<script src="/eco.js"></script>
<script src="/social.js"></script>
<script src="/vendor/motion.js"></script>
<script src="/fx.js"></script>
</body>
</html>
